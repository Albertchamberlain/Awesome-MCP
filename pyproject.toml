[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-mcp"
version = "0.1.0"
description = "Curated MCP catalog with CLI and searchable MCP meta-server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albertchamberlain" }]
keywords = ["mcp", "model-context-protocol", "awesome-list", "ai"]
dependencies = [
    "mcp>=1.6.0,<2",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
awesome-mcp = "awesome_mcp.cli:app"
awesome-mcp-server = "awesome_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/catalog.yaml" = "awesome_mcp/catalog.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
