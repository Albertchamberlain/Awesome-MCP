# Awesome-MCP catalog — edit this file and run: awesome-mcp readme
meta:
  version: 1
  updated: "2026-09-25"
  description: Curated Model Context Protocol servers, clients, and registries

categories:
  server:
    label: MCP Servers
    description: Tools and data sources exposed to AI agents via MCP
  client:
    label: MCP Clients
    description: Apps and IDEs that connect to MCP servers
  registry:
    label: Registries & Directories
    description: Discover and install MCP servers
  framework:
    label: SDKs & Frameworks
    description: Libraries for building MCP servers and clients

